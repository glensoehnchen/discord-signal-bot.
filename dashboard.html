<!DOCTYPE html>
<html lang="de" class="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Signal Bot</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', '-apple-system', 'sans-serif'] },
          colors: {
            bg:    { DEFAULT: '#0a0a0a', card: '#111111', hover: '#161616', border: '#1f1f1f' },
            txt:   { primary: '#f0f0f0', secondary: '#666', muted: '#333' },
            green: { DEFAULT: '#22c55e', dim: 'rgba(34,197,94,.08)' },
            red:   { DEFAULT: '#ef4444', dim: 'rgba(239,68,68,.08)' },
            blue:  { DEFAULT: '#3b82f6' },
          },
        }
      }
    }
  </script>
  <style>
    * { -webkit-font-smoothing: antialiased; box-sizing: border-box; }
    body { background: #0a0a0a; color: #f0f0f0; font-family: 'Inter', -apple-system, sans-serif; }
    @keyframes in { from { opacity:0; transform:translateY(10px) } to { opacity:1; transform:translateY(0) } }
    .in  { animation: in .4s ease forwards; }
    @keyframes breathe { 0%,100%{opacity:1} 50%{opacity:.2} }
    .breathe { animation: breathe 2.4s ease-in-out infinite; }
    details summary { list-style:none; cursor:pointer; }
    details summary::-webkit-details-marker { display:none; }
    details[open] .chevron { transform: rotate(180deg); }
    .chevron { transition: transform .2s ease; display:inline-block; }
    ::-webkit-scrollbar { width:0; }
    input:-webkit-autofill { -webkit-box-shadow: 0 0 0 100px #111 inset !important; -webkit-text-fill-color: #f0f0f0 !important; }
  </style>
</head>
<body class="min-h-screen">

<!-- ── LOGIN ─────────────────────────────────────────────────────────── -->
<div id="loginWrap" class="min-h-screen flex items-center justify-center px-6">
  <div class="w-full max-w-[320px] in">
    <div class="mb-10 text-center">
      <div class="inline-flex items-center justify-center w-10 h-10 rounded-2xl bg-[#111] border border-[#1f1f1f] mb-6">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f0f0f0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/>
        </svg>
      </div>
      <p class="text-[22px] font-semibold tracking-tight">Signal Bot</p>
      <p class="text-[13px] text-[#555] mt-1">Trading Dashboard</p>
    </div>
    <input id="pw" type="password" placeholder="Password"
      class="w-full bg-[#111] border border-[#1f1f1f] rounded-xl px-4 py-3 text-[15px] text-[#f0f0f0] placeholder-[#333] outline-none focus:border-[#333] transition mb-2"/>
    <p id="loginErr" class="text-[12px] text-red-500 mb-3 h-4"></p>
    <button onclick="doLogin()" class="w-full bg-[#f0f0f0] text-[#0a0a0a] text-[14px] font-semibold rounded-xl py-3 hover:bg-white transition active:scale-[.98]">
      Continue
    </button>
  </div>
</div>

<!-- ── APP ───────────────────────────────────────────────────────────── -->
<div id="app" class="hidden min-h-screen">

  <!-- Nav -->
  <nav class="sticky top-0 z-20 border-b border-[#1a1a1a]" style="background:rgba(10,10,10,.85);backdrop-filter:blur(24px)">
    <div class="max-w-3xl mx-auto px-6 h-14 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <span class="w-1.5 h-1.5 rounded-full bg-green-500 breathe"></span>
        <span class="text-[14px] font-medium text-[#f0f0f0]">Signal Bot</span>
      </div>
      <div class="flex items-center gap-5">
        <span class="text-[12px] text-[#444]" id="lastUpdate"></span>
        <button onclick="loadAll()" class="text-[12px] text-[#555] hover:text-[#f0f0f0] transition">Refresh</button>
        <button onclick="doLogout()" class="text-[12px] text-[#555] hover:text-[#f0f0f0] transition">Sign out</button>
      </div>
    </div>
  </nav>

  <main class="max-w-3xl mx-auto px-6 py-8 space-y-3">

    <!-- Hero -->
    <div class="rounded-2xl border border-[#1a1a1a] bg-[#0e0e0e] px-7 py-6">
      <p class="text-[12px] text-[#444] uppercase tracking-widest font-medium mb-3">Realized P&L</p>
      <p id="heroPnl" class="text-[48px] font-semibold tracking-tight leading-none mb-5">—</p>
      <div class="grid grid-cols-4 gap-px bg-[#1a1a1a] rounded-xl overflow-hidden">
        <div class="bg-[#0e0e0e] px-4 py-3"><p class="text-[11px] text-[#444] mb-1">Win Rate</p><p id="mWR"   class="text-[16px] font-semibold">—</p></div>
        <div class="bg-[#0e0e0e] px-4 py-3"><p class="text-[11px] text-[#444] mb-1">Trades</p>  <p id="mTR"   class="text-[16px] font-semibold">—</p></div>
        <div class="bg-[#0e0e0e] px-4 py-3"><p class="text-[11px] text-[#444] mb-1">Balance</p> <p id="mBAL"  class="text-[16px] font-semibold">—</p></div>
        <div class="bg-[#0e0e0e] px-4 py-3"><p class="text-[11px] text-[#444] mb-1">Open</p>    <p id="mOPEN" class="text-[16px] font-semibold">—</p></div>
      </div>
    </div>

    <!-- Chart -->
    <div class="rounded-2xl border border-[#1a1a1a] bg-[#0e0e0e] px-6 py-5">
      <div class="flex items-center justify-between mb-5">
        <p class="text-[13px] font-medium text-[#f0f0f0]">Equity Curve</p>
        <div class="flex items-center gap-3">
          <div class="flex gap-0.5" id="ctype">
            <button onclick="setCtype('equity',this)" class="ctp text-[12px] px-3 py-1 rounded-lg bg-[#1a1a1a] text-[#f0f0f0] font-medium transition">Balance</button>
            <button onclick="setCtype('upnl',this)"   class="ctp text-[12px] px-3 py-1 rounded-lg text-[#444] hover:text-[#999] transition">PnL</button>
          </div>
          <div class="flex gap-0.5" id="range">
            <button onclick="setDays('1',this)"  class="rng text-[12px] px-3 py-1 rounded-lg text-[#444] hover:text-[#999] transition">1D</button>
            <button onclick="setDays('7',this)"  class="rng text-[12px] px-3 py-1 rounded-lg bg-[#1a1a1a] text-[#f0f0f0] font-medium transition">7D</button>
            <button onclick="setDays('30',this)" class="rng text-[12px] px-3 py-1 rounded-lg text-[#444] hover:text-[#999] transition">30D</button>
            <button onclick="setDays('90',this)" class="rng text-[12px] px-3 py-1 rounded-lg text-[#444] hover:text-[#999] transition">90D</button>
          </div>
        </div>
      </div>
      <div class="h-48" id="chartWrap"><canvas id="eqc"></canvas></div>
    </div>

    <!-- Calendar -->
    <div class="rounded-2xl border border-[#1a1a1a] bg-[#0e0e0e] px-6 py-5">
      <div class="flex items-center justify-between mb-5">
        <p class="text-[13px] font-medium" id="calLabel"></p>
        <div class="flex gap-1">
          <button onclick="moveMonth(-1)" class="w-7 h-7 rounded-lg bg-[#161616] text-[#666] hover:text-[#f0f0f0] text-[15px] flex items-center justify-center transition">‹</button>
          <button onclick="moveMonth(1)"  class="w-7 h-7 rounded-lg bg-[#161616] text-[#666] hover:text-[#f0f0f0] text-[15px] flex items-center justify-center transition">›</button>
        </div>
      </div>
      <div class="grid grid-cols-7 gap-1 mb-2">
        <span class="text-[10px] text-[#333] text-center font-medium py-1">Mo</span>
        <span class="text-[10px] text-[#333] text-center font-medium py-1">Di</span>
        <span class="text-[10px] text-[#333] text-center font-medium py-1">Mi</span>
        <span class="text-[10px] text-[#333] text-center font-medium py-1">Do</span>
        <span class="text-[10px] text-[#333] text-center font-medium py-1">Fr</span>
        <span class="text-[10px] text-[#333] text-center font-medium py-1">Sa</span>
        <span class="text-[10px] text-[#333] text-center font-medium py-1">So</span>
      </div>
      <div class="grid grid-cols-7 gap-1" id="calGrid"></div>
    </div>

    <!-- Positions -->
    <div class="rounded-2xl border border-[#1a1a1a] bg-[#0e0e0e] overflow-hidden">
      <div class="px-6 py-4 flex items-center justify-between border-b border-[#1a1a1a]">
        <p class="text-[13px] font-medium">Open Positions</p>
        <span class="text-[12px] text-[#444]" id="posCount"></span>
      </div>
      <div id="positions"></div>
    </div>

    <!-- History -->
    <div class="rounded-2xl border border-[#1a1a1a] bg-[#0e0e0e] overflow-hidden">
      <div class="px-6 py-4 flex items-center justify-between border-b border-[#1a1a1a]">
        <p class="text-[13px] font-medium">Trade History</p>
        <span class="text-[12px] text-[#444]" id="tradeCount"></span>
      </div>
      <div id="history"></div>
    </div>

    <!-- Awards -->
    <div class="rounded-2xl border border-[#1a1a1a] bg-[#0e0e0e] px-6 py-5">
      <p class="text-[13px] font-medium mb-5">Highlights</p>
      <div class="grid grid-cols-2 md:grid-cols-4 gap-2" id="awards"></div>
    </div>

  </main>
</div>

<!-- Modal -->
<div id="modal" class="hidden fixed inset-0 z-50 flex items-end md:items-center justify-center px-4 pb-6 md:pb-0">
  <div class="absolute inset-0" style="background:rgba(0,0,0,.7);backdrop-filter:blur(8px)" onclick="closeModal()"></div>
  <div class="relative w-full max-w-sm rounded-2xl border border-[#1f1f1f] bg-[#111] p-6 in">
    <div class="flex items-center justify-between mb-5">
      <p class="text-[15px] font-semibold" id="modalTitle"></p>
      <button onclick="closeModal()" class="w-7 h-7 rounded-lg bg-[#1a1a1a] text-[#555] hover:text-[#f0f0f0] text-[12px] flex items-center justify-center transition">✕</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<script>
const PASSWORD = "signal2024";
let trades=[], positions=[], balance={}, stats={}, equity=[];
let days='7', ctype='equity', chart=null;
let calY=new Date().getFullYear(), calM=new Date().getMonth();

// ── AUTH
function doLogin(){
  if(document.getElementById('pw').value===PASSWORD){
    document.getElementById('loginWrap').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    document.getElementById('loginErr').textContent='';
    loadAll();
    setInterval(loadAll,30000);
  } else {
    document.getElementById('loginErr').textContent='Incorrect password.';
  }
}
document.getElementById('pw').addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); });
function doLogout(){
  document.getElementById('app').classList.add('hidden');
  document.getElementById('loginWrap').classList.remove('hidden');
  document.getElementById('pw').value='';
}

// ── FETCH
async function loadAll(){
  try {
    const [s,p,t,b,e]=await Promise.all([
      fetch('/api/stats').then(r=>r.json()),
      fetch('/api/positions').then(r=>r.json()),
      fetch('/api/trades').then(r=>r.json()),
      fetch('/api/balance').then(r=>r.json()),
      fetch(`/api/equity?days=${days}`).then(r=>r.json()),
    ]);
    stats=s; positions=p; trades=t; balance=b; equity=e;
    document.getElementById('lastUpdate').textContent=new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
    renderHero(); buildChart(); renderCal(); renderPositions(); renderHistory(); renderAwards();
  } catch(err){ console.error(err); }
}

// ── HERO
function renderHero(){
  const rpnl=parseFloat(stats.totalPnl||0);
  const upnl=positions.reduce((s,p)=>s+parseFloat(p.unrealizedPL||0),0);
  const bal=parseFloat(balance.accountEquity||0);
  const hp=document.getElementById('heroPnl');
  hp.textContent=(rpnl>=0?'+':'')+fmt(rpnl);
  hp.className='text-[48px] font-semibold tracking-tight leading-none mb-5 '+(rpnl>=0?'text-green-500':'text-red-500');
  document.getElementById('mWR').textContent=stats.total>0?stats.rate+'%':'—';
  document.getElementById('mTR').textContent=(stats.wins||0)+'W · '+(stats.losses||0)+'L';
  document.getElementById('mBAL').textContent=fmt(bal);
  document.getElementById('mOPEN').textContent=positions.length;
}

// ── CHART
function setDays(d,btn){
  days=d;
  toggle('.rng',btn);
  fetch(`/api/equity?days=${days}`).then(r=>r.json()).then(e=>{ equity=e; rebuildChart(); });
}
function setCtype(t,btn){ ctype=t; toggle('.ctp',btn); rebuildChart(); }
function rebuildChart(){ if(chart){chart.destroy();chart=null;} buildChart(); }
function buildChart(){
  const wrap=document.getElementById('chartWrap');
  if(!equity||equity.length<2){
    wrap.innerHTML='<div class="h-full flex items-center justify-center text-[13px] text-[#333]">No data yet</div>';
    return;
  }
  wrap.innerHTML='<canvas id="eqc"></canvas>';
  const data=equity.map(e=>ctype==='equity'?e.equity:e.upnl);
  const labels=equity.map(e=>new Date(e.time).toLocaleString('de-DE',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}));
  const up=data[data.length-1]>=data[0];
  const col=up?'#22c55e':'#ef4444';
  const ctx=document.getElementById('eqc').getContext('2d');
  const g=ctx.createLinearGradient(0,0,0,192);
  g.addColorStop(0,up?'rgba(34,197,94,.1)':'rgba(239,68,68,.08)');
  g.addColorStop(1,'rgba(0,0,0,0)');
  chart=new Chart(ctx,{
    type:'line',
    data:{labels,datasets:[{data,borderColor:col,backgroundColor:g,borderWidth:1.5,fill:true,tension:.4,
      pointRadius:data.length>30?0:3,pointHoverRadius:5,pointBackgroundColor:col,
      pointBorderColor:'#0e0e0e',pointBorderWidth:2}]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{backgroundColor:'#161616',titleColor:'#999',bodyColor:col,
        borderColor:'#2a2a2a',borderWidth:1,padding:10,cornerRadius:10,
        callbacks:{label:c=>' $'+c.raw}}},
      scales:{
        x:{grid:{display:false},border:{display:false},ticks:{color:'#333',font:{size:10},maxTicksLimit:6}},
        y:{grid:{color:'rgba(255,255,255,.03)'},border:{display:false},
          ticks:{color:'#333',font:{size:10},callback:v=>'$'+v}}
      },interaction:{intersect:false,mode:'index'}
    }
  });
}

// ── CALENDAR
function moveMonth(d){ calM+=d; if(calM<0){calM=11;calY--;} if(calM>11){calM=0;calY++;} renderCal(); }
function renderCal(){
  const mn=['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('calLabel').textContent=mn[calM]+' '+calY;
  const dm={};
  for(const t of trades){
    if(t.status!=='closed'||!t.closeTime)continue;
    const d=new Date(t.closeTime);
    if(d.getFullYear()!==calY||d.getMonth()!==calM)continue;
    dm[d.getDate()]=(dm[d.getDate()]||0)+(t.pnl||0);
  }
  const first=new Date(calY,calM,1).getDay();
  const dim=new Date(calY,calM+1,0).getDate();
  const off=first===0?6:first-1;
  const today=new Date(), isCur=today.getFullYear()===calY&&today.getMonth()===calM;
  let html='';
  for(let i=0;i<off;i++) html+='<div></div>';
  for(let day=1;day<=dim;day++){
    const pnl=dm[day], isT=isCur&&today.getDate()===day;
    let cls='aspect-square rounded-xl flex flex-col items-center justify-center cursor-pointer transition hover:bg-[#161616] ';
    if(isT) cls+='ring-1 ring-[#333] ';
    if(pnl!==undefined) cls+= pnl>=0?'bg-green-500/[.07] hover:bg-green-500/10':'bg-red-500/[.06] hover:bg-red-500/10';
    const sub=pnl!==undefined?`<span class="text-[9px] font-semibold ${pnl>=0?'text-green-500':'text-red-500'} leading-none mt-0.5">${pnl>=0?'+':''}$${Math.abs(pnl).toFixed(0)}</span>`:'';
    html+=`<div class="${cls}" onclick="openDay(${day})"><span class="text-[12px] font-medium text-[#888]">${day}</span>${sub}</div>`;
  }
  document.getElementById('calGrid').innerHTML=html;
}
function openDay(day){
  const dt=trades.filter(t=>{if(!t.closeTime)return false;const d=new Date(t.closeTime);return d.getFullYear()===calY&&d.getMonth()===calM&&d.getDate()===day;});
  if(!dt.length)return;
  const pnl=dt.reduce((s,t)=>s+(t.pnl||0),0);
  const mn=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  document.getElementById('modalTitle').textContent=`${day} ${mn[calM]} ${calY}`;
  document.getElementById('modalBody').innerHTML=`
    <div class="flex gap-6 mb-5 p-4 rounded-xl bg-[#161616]">
      <div><p class="text-[11px] text-[#444] mb-1">Trades</p><p class="text-[18px] font-semibold">${dt.length}</p></div>
      <div><p class="text-[11px] text-[#444] mb-1">P&L</p><p class="text-[18px] font-semibold ${pnl>=0?'text-green-500':'text-red-500'}">${pnl>=0?'+':''}${fmt(pnl)}</p></div>
    </div>
    ${dt.map(t=>`<div class="flex justify-between items-center py-3 border-b border-[#1a1a1a] last:border-0">
      <div><p class="text-[14px] font-medium">${t.asset}</p><p class="text-[12px] text-[#444] mt-0.5">${t.direction} · $${t.entry} · ${t.closeReason||'—'}</p></div>
      <p class="text-[14px] font-semibold ${t.pnl>=0?'text-green-500':'text-red-500'}">${t.pnl>=0?'+':''}${fmt(t.pnl)}</p>
    </div>`).join('')}`;
  document.getElementById('modal').classList.remove('hidden');
}
function closeModal(){ document.getElementById('modal').classList.add('hidden'); }

// ── POSITIONS
function renderPositions(){
  document.getElementById('posCount').textContent=positions.length+' open';
  if(!positions.length){ document.getElementById('positions').innerHTML=empty('No open positions'); return; }
  document.getElementById('positions').innerHTML=positions.map((p,i)=>{
    const upnl=parseFloat(p.unrealizedPL||0), rl=parseFloat(p.achievedProfits||0);
    const isL=p.holdSide==='long';
    const t=trades.find(t=>t.asset===p.symbol.replace('USDT','')&&t.status==='open');
    const tpStr=t?.targets?.length?t.targets.map((tp,j)=>`TP${j+1} $${tp.price}`).join(' · '):'—';
    return `<details>
      <summary class="flex items-center justify-between px-6 py-4 hover:bg-[#111] transition border-b border-[#1a1a1a]">
        <div class="flex items-center gap-3">
          <span class="text-[14px] font-medium">${p.symbol}</span>
          <span class="text-[11px] font-medium px-2 py-0.5 rounded-md ${isL?'text-green-500 bg-green-500/10':'text-red-500 bg-red-500/10'}">${isL?'Long':'Short'}</span>
        </div>
        <div class="flex items-center gap-3">
          <span class="text-[15px] font-semibold ${upnl>=0?'text-green-500':'text-red-500'}">${upnl>=0?'+':''}${fmt(upnl)}</span>
          <svg class="chevron w-3.5 h-3.5 text-[#333]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
      </summary>
      <div class="px-6 pb-5 pt-4 grid grid-cols-3 gap-4 bg-[#0a0a0a] border-b border-[#1a1a1a]">
        ${kv('Entry','$'+parseFloat(p.openPriceAvg).toFixed(4))}
        ${kv('Size',p.total)}
        ${kv('Stop Loss',t?.stopLoss?'$'+t.stopLoss:'—','text-red-500')}
        ${kv('Take Profits',tpStr)}
        ${kv('Unrealized',(upnl>=0?'+':'')+fmt(upnl),upnl>=0?'text-green-500':'text-red-500')}
        ${kv('Realized',(rl>=0?'+':'')+fmt(rl),rl>=0?'text-green-500':'text-red-500')}
      </div>
    </details>`;
  }).join('');
}

// ── HISTORY
function renderHistory(){
  const open=trades.filter(t=>t.status==='open');
  const closed=trades.filter(t=>t.status==='closed').slice(-40).reverse();
  const all=[...open,...closed];
  document.getElementById('tradeCount').textContent=all.length+' trades';
  if(!all.length){ document.getElementById('history').innerHTML=empty('No trades yet'); return; }
  const edot=e=>e.type.includes('TP')?'bg-green-500':e.type==='SL'?'bg-red-500':e.type.includes('BE')?'bg-blue-500':'bg-[#333]';
  document.getElementById('history').innerHTML=all.map((t,i)=>{
    const sc=t.status==='open'?'text-[#f59e0b]':t.pnl>0?'text-green-500':'text-red-500';
    const sl=t.status==='open'?'Open':t.pnl>0?'Win':'Loss';
    const evHtml=t.events?.length?`<div class="mt-4 space-y-1.5">
      ${t.events.map(e=>`<div class="flex items-center gap-2.5 px-3 py-2 rounded-lg bg-[#111] text-[11px]">
        <span class="w-1.5 h-1.5 rounded-full flex-shrink-0 ${edot(e)}"></span>
        <span class="font-medium min-w-[90px] text-[#aaa]">${e.type}</span>
        <span class="text-[#444] flex-1">@ $${e.price}</span>
        <span class="font-medium ${(e.pnl||0)>=0?'text-green-500':'text-red-500'}">${(e.pnl||0)>=0?'+':''}${fmt(e.pnl||0)}</span>
        <span class="text-[#333]">${new Date(e.time).toLocaleString('de-DE',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}</span>
      </div>`).join('')}</div>`:'';
    return `<details>
      <summary class="flex items-center justify-between px-6 py-4 hover:bg-[#111] transition border-b border-[#1a1a1a]">
        <div class="flex items-center gap-2.5">
          <span class="text-[14px] font-medium">${t.asset}</span>
          <span class="text-[11px] font-medium px-2 py-0.5 rounded-md ${t.direction==='Long'?'text-green-500 bg-green-500/10':'text-red-500 bg-red-500/10'}">${t.direction}</span>
          <span class="text-[12px] ${sc}">${sl}</span>
        </div>
        <div class="flex items-center gap-3">
          <span class="text-[14px] font-semibold ${t.pnl>=0?'text-green-500':'text-red-500'}">${t.pnl>=0?'+':''}${fmt(t.pnl)}</span>
          <svg class="chevron w-3.5 h-3.5 text-[#333]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
      </summary>
      <div class="px-6 pb-5 pt-4 grid grid-cols-3 gap-4 bg-[#0a0a0a] border-b border-[#1a1a1a]">
        ${kv('Entry','$'+t.entry)}
        ${kv('Stop Loss','$'+t.stopLoss,'text-red-500')}
        ${kv('Take Profits',t.targets?.map((tp,j)=>`TP${j+1} $${tp.price}`).join('<br>')||'—')}
        ${kv('P&L',(t.pnl>=0?'+':'')+fmt(t.pnl),t.pnl>=0?'text-green-500':'text-red-500')}
        ${kv('Opened',fmtDate(t.openTime))}
        ${kv('Closed',t.closeTime?fmtDate(t.closeTime):'—')}
        ${t.closeReason?kv('Reason',t.closeReason):''}
      </div>
      ${evHtml?`<div class="px-6 pb-5 bg-[#0a0a0a] border-b border-[#1a1a1a]">${evHtml}</div>`:''}
    </details>`;
  }).join('');
}

// ── AWARDS
function renderAwards(){
  const closed=trades.filter(t=>t.status==='closed');
  if(!closed.length){ document.getElementById('awards').innerHTML='<p class="col-span-4 text-center text-[13px] text-[#333] py-4">No closed trades yet</p>'; return; }
  const sorted=[...closed].sort((a,b)=>b.pnl-a.pnl);
  const best=sorted[0], sec=sorted[1], worst=sorted[sorted.length-1];
  const avg=closed.reduce((s,t)=>s+t.pnl,0)/closed.length;
  document.getElementById('awards').innerHTML=[
    best  ? aw('🥇','Best Trade',best.asset,'+'+fmt(best.pnl),'text-green-500',best.direction,best.openTime):'',
    sec   ? aw('🥈','Runner-up',sec.asset,'+'+fmt(sec.pnl),'text-green-500',sec.direction,sec.openTime):'',
    worst ? aw('📉','Worst Trade',worst.asset,fmt(worst.pnl),'text-red-500',worst.direction,worst.openTime):'',
    `<div class="rounded-xl bg-[#111] border border-[#1a1a1a] p-4">
      <p class="text-[16px] mb-2">📊</p>
      <p class="text-[11px] text-[#444] mb-1">Avg P&L / Trade</p>
      <p class="text-[17px] font-semibold ${avg>=0?'text-green-500':'text-red-500'}">${avg>=0?'+':''}${fmt(avg)}</p>
      <p class="text-[12px] text-[#333] mt-1">${closed.length} trades</p>
    </div>`
  ].join('');
}
function aw(icon,label,name,val,vc,dir,time){
  return `<div class="rounded-xl bg-[#111] border border-[#1a1a1a] p-4">
    <p class="text-[16px] mb-2">${icon}</p>
    <p class="text-[11px] text-[#444] mb-1">${label}</p>
    <p class="text-[15px] font-semibold mb-0.5">${name}</p>
    <p class="text-[15px] font-semibold ${vc}">${val}</p>
    <p class="text-[12px] text-[#333] mt-1">${dir} · ${new Date(time).toLocaleDateString('de-DE')}</p>
  </div>`;
}

// ── UTILS
function fmt(n){ return '$'+parseFloat(n).toFixed(2); }
function fmtDate(ts){ return new Date(ts).toLocaleString('de-DE',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}); }
function kv(label,val,vc='text-[#f0f0f0]'){
  return `<div><p class="text-[10px] text-[#333] uppercase tracking-widest font-medium mb-1.5">${label}</p><p class="text-[13px] font-medium ${vc}">${val}</p></div>`;
}
function empty(msg){ return `<p class="px-6 py-8 text-[13px] text-[#333] text-center">${msg}</p>`; }
function toggle(sel,btn){
  document.querySelectorAll(sel).forEach(b=>{
    b.className = b===btn
      ? b.className.replace('text-[#444] hover:text-[#999]','text-[#f0f0f0] font-medium')+' bg-[#1a1a1a]'
      : b.className.replace('bg-[#1a1a1a]','').replace('text-[#f0f0f0] font-medium','text-[#444] hover:text-[#999]');
  });
}
</script>
